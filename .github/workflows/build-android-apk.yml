name: Build and Release Vybeora Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Web Assets
        working-directory: frontend
        run: npm run build

      - name: Set up Java Development Kit (JDK) 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vybeora-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0-apk
          name: Vybeora Android App v1.0.0
          body: |
            ## 📱 Vybeora Android App (.apk)
            Download and install the official Vybeora Android APK directly onto your phone!
            
            ### Installation Instructions:
            1. Download `Vybeora.apk` below.
            2. Open the file on your Android phone.
            3. If prompted, allow "Install from Unknown Sources".
            4. Tap **Install** and enjoy synchronized watch parties with friends!
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
